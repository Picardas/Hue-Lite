<!doctype html>
<!--
  Local harness for the dashboard script: a mock `hass` (states, registries,
  callWS, callService) and stand-ins for ha-card and ha-icon. Serve the repo
  root and open /tests/harness/ (e.g. python3 -m http.server --bind 127.0.0.1).
  window.dash is the generated dashboard and window.calls the actions called.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hue-Lite harness</title>
  <style>
    body { margin: 16px; font-family: system-ui, sans-serif; background: #f5f5f5;
           --primary-text-color: #212121; --secondary-text-color: #727272; --rgb-primary-text-color: 33, 33, 33;
           --primary-color: #03a9f4; --rgb-primary-color: 3, 169, 244; }
    /* ?dark: Home Assistant's dark theme. */
    body.dark { background: #111; color: #e1e1e1; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
                --rgb-primary-text-color: 225, 225, 225; --card-background-color: #1c1c1c; }
    h2 { font-size: 15px; margin: 20px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; max-width: 420px; }
    .grid > * { grid-column: span 12; }
    #rooms { max-width: 900px; }
    pre { font-size: 11px; max-height: 300px; overflow: auto; background: #fff; padding: 8px; }
  </style>
  <script>
    // Styled in their own shadow roots, as Home Assistant's are, so they look
    // right inside the cards' shadow roots: a card, and an icon-sized box
    // with the icon's name in tiny type.
    const styled = (css) => class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML = `<style>:host { ${css} }</style><slot></slot>`;
      }
    };
    customElements.define("ha-card", styled(`display: block; background: var(--card-background-color, #fff); border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);`));
    customElements.define("ha-icon", class extends styled(`display: inline-flex; align-items: center; justify-content: center;
      width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); overflow: hidden; font-size: 6px;
      line-height: 1; text-align: center; word-break: break-all;`) {
      static get observedAttributes() { return ["icon"]; }
      attributeChangedCallback() { this.textContent = (this.getAttribute("icon") || "").replace("mdi:", ""); }
    });
  </script>
  <script src="../../custom_components/hue_lite/frontend/hue-lite.js"></script>
</head>
<body>
  <h2>Whole home</h2>
  <div id="home" class="grid"></div>
  <h2>Rooms</h2>
  <div id="rooms"></div>
  <div id="routines"></div>
  <div id="dimmers" style="margin-top: 16px"></div>
  <h2>Generated dashboard</h2>
  <pre id="config"></pre>
  <script>
    if (location.search.includes("dark")) document.body.classList.add("dark");
    const light = (id, name, state, attributes = {}) =>
      ({ entity_id: id, state, attributes: { friendly_name: name, ...attributes } });
    // RGB colours as Home Assistant works them out from the xy colours.
    const relax = { brightness: 143, color_mode: "xy", xy_color: [0.5019, 0.4152], rgb_color: [255, 189, 86] };
    const coolBright = { brightness: 255, color_mode: "xy", xy_color: [0.3812, 0.3794], rgb_color: [255, 236, 186] };

    const states = Object.fromEntries([
      light("light.living_room", "Living Room", "on", relax),
      light("light.floor_lamp", "Floor lamp", "on", coolBright),
      light("light.kitchen", "Kitchen", "on", relax),
      light("light.bedroom", "Bedroom", "off"),
      light("light.office", "Office", "on", { brightness: 51, color_mode: "xy", xy_color: [0.2712, 0.1723], rgb_color: [179, 127, 255] }),
      light("light.lamp", "Reading lamp", "on", coolBright),
      light("light.garden", "Garden", "on"),
      light("light.cupboard", "Cupboard", "off"),
      light("light.all", "All", "on", { entity_id: ["light.living_room", "light.kitchen"] }),
      { entity_id: "switch.hue_lite_wake_up_on_weekdays", state: "on", attributes: {} },
      { entity_id: "time.hue_lite_wake_up_mon_fri", state: "06:45:00", attributes: {} },
      { entity_id: "switch.hue_lite_wake_up_on_weekends", state: "off", attributes: {} },
      { entity_id: "switch.hue_lite_evening_routine_sun_thu_nights", state: "on", attributes: {} },
      { entity_id: "time.hue_lite_bedtime_sun_thu_nights", state: "23:00:00", attributes: {} },
      { entity_id: "switch.hue_lite_evening_routine_fri_sat_nights", state: "off", attributes: {} },
      { entity_id: "time.hue_lite_bedtime_fri_sat_nights", state: "00:00:00", attributes: {} },
      { entity_id: "sensor.hue_lite_evening_routine", state: "day", attributes: { summary: "On 16:30 · off 23:00" } },
      { entity_id: "sensor.hue_lite_natural_light", state: "day", attributes: { xy_color: [0.3812, 0.3794], rgb_color: [255, 236, 186] } },
      { entity_id: "switch.hue_lite_coming_home", state: "on", attributes: {} },
      { entity_id: "switch.hue_lite_coming_home_only_after_dark", state: "on", attributes: {} },
      { entity_id: "switch.hue_lite_lights_off_when_everyone_leaves", state: "off", attributes: {} },
      {
        entity_id: "sensor.hue_lite_light_scenes", state: "4",
        attributes: {
          // The routine has the living room; the kitchen was put on Auto; the
          // living room's floor lamp is in a scene of its own.
          scenes: { "light.office": "nebula", "light.lamp": "natural", "light.living_room": "routine", "light.floor_lamp": "natural" },
          auto: ["light.kitchen", "light.living_room"],
        },
      },
    ].map((s) => [s.entity_id, s]));

    const entities = {
      "light.living_room": { entity_id: "light.living_room", area_id: "living_room", labels: ["evening", "coming_home"] },
      "light.floor_lamp": { entity_id: "light.floor_lamp", area_id: "living_room", labels: [] },
      "light.kitchen": { entity_id: "light.kitchen", device_id: "kitchen_bulb", labels: [] },
      "light.bedroom": { entity_id: "light.bedroom", area_id: "bedroom", labels: ["evening", "wake_up", "nightlight"] },
      "light.office": { entity_id: "light.office", area_id: "office", labels: ["evening"] },
      "light.lamp": { entity_id: "light.lamp", labels: ["lamps"] },
      "light.garden": { entity_id: "light.garden", labels: ["lighting_exclude"] },
      "light.cupboard": { entity_id: "light.cupboard", area_id: "bedroom", hidden: true },
      "light.all": { entity_id: "light.all", labels: [] },
    };

    const setup = {
      roles: { evening: "evening", wake_up: "wake_up", nightlight: "nightlight", coming_home: "coming_home", exclude: "lighting_exclude" },
      labels: [
        { label_id: "evening", name: "Evening", icon: "mdi:weather-sunset" },
        { label_id: "lighting_exclude", name: "Exclude from lighting", icon: null },
        { label_id: "lamps", name: "Lamps", icon: "mdi:lamp" },
        { label_id: "empty", name: "Nothing here", icon: null },
      ],
      entities: {
        light_scenes: "sensor.hue_lite_light_scenes",
        natural_light: "sensor.hue_lite_natural_light",
        evening_routine: "sensor.hue_lite_evening_routine",
        evening_weeknights: "switch.hue_lite_evening_routine_sun_thu_nights",
        evening_weekends: "switch.hue_lite_evening_routine_fri_sat_nights",
        bedtime_weeknight: "time.hue_lite_bedtime_sun_thu_nights",
        bedtime_weekend: "time.hue_lite_bedtime_fri_sat_nights",
        wake_up_weekdays: "switch.hue_lite_wake_up_on_weekdays",
        wake_up_weekday: "time.hue_lite_wake_up_mon_fri",
        wake_up_weekends: "switch.hue_lite_wake_up_on_weekends",
        wake_up_weekend: "time.hue_lite_wake_up_sat_sun",
        coming_home_enabled: "switch.hue_lite_coming_home",
        coming_home_only_dark: "switch.hue_lite_coming_home_only_after_dark",
        leaving_home_enabled: "switch.hue_lite_lights_off_when_everyone_leaves",
      },
      presets: {
        energize: { rgb_colors: [[246, 255, 254]] },
        cool_bright: { rgb_colors: [[255, 236, 186]] },
        read: { rgb_colors: [[255, 211, 130]] },
        relax: { rgb_colors: [[255, 189, 86]] },
        rest: { rgb_colors: [[255, 161, 40]] },
        nightlight: { rgb_colors: [[255, 71, 22]] },
        golden_hour: { rgb_colors: [[255, 205, 90], [255, 167, 90], [255, 130, 68], [255, 200, 48], [255, 171, 121]] },
        aurora: { rgb_colors: [[20, 255, 126], [110, 255, 185], [109, 250, 255], [162, 255, 69], [110, 255, 238]] },
        ember: { rgb_colors: [[255, 71, 8], [255, 96, 27], [255, 66, 50], [255, 123, 27], [255, 139, 39]] },
        forest: { rgb_colors: [[83, 255, 73], [121, 255, 81], [75, 255, 140], [157, 255, 76], [194, 255, 80]] },
        moonlit: { rgb_colors: [[255, 206, 118], [255, 236, 186], [255, 182, 203], [255, 214, 146], [232, 193, 255]] },
        nebula: { rgb_colors: [[108, 21, 255], [179, 127, 255], [151, 80, 255], [222, 168, 255], [88, 135, 255]] },
      },
      dimmers: [{ id: "dimmer_living", name: "Living room dimmer", area_id: "living_room" }],
      add_dashboard: true,
    };

    // Home Assistant's dashboards, for adding Hue-Lite's (?existing: one's there already).
    window.dashboards = location.search.includes("existing")
      ? [{ url_path: "my-lights", title: "My lights", mode: "storage", config: { strategy: { type: "custom:hue-lite" } } }]
      : [{ url_path: "dashboard-home", title: "Home", mode: "storage", config: { views: [] } }];
    window.dashboardClaimed = false;

    // Hue-Lite's shared settings, as its websocket keeps them: set_scenes and
    // set_dimmer change them and tell every subscriber. ?unshared starts with
    // scenes saved the old way, per user, to see them handed over.
    window.sharedData = {
      layouts: {}, dimmers: {},
      dimmer_default: {
        order: ["natural", "energize", "cool_bright", "read", "relax", "rest", "nightlight", "golden_hour", "nebula", "aurora", "ember", "forest", "moonlit"],
        hidden: ["golden_hour", "nebula", "aurora", "ember", "forest", "moonlit"],
      },
    };
    const subscribers = new Set();
    const publish = () => { for (const cb of subscribers) cb(JSON.parse(JSON.stringify(window.sharedData))); };
    window.userData = location.search.includes("unshared")
      ? { hue_lite_rooms: { order: [], collapsed: [], scenes: { living_room: { order: ["relax", "energize"], hidden: ["aurora"] } } } }
      : {};

    window.calls = [];
    window.hass = {
      states,
      entities,
      // The kitchen bulb's device carries the Lamps label, so it joins that group too.
      devices: { kitchen_bulb: { area_id: "kitchen", labels: ["lamps"] } },
      areas: {
        bedroom: { area_id: "bedroom", name: "Bedroom", floor_id: "first" },
        office: { area_id: "office", name: "Office", floor_id: "first", icon: "mdi:desk" },
        living_room: { area_id: "living_room", name: "Living Room", floor_id: "ground", icon: "mdi:sofa" },
        kitchen: { area_id: "kitchen", name: "Kitchen", floor_id: "ground" },
        hall: { area_id: "hall", name: "Hall", floor_id: "ground" },
      },
      floors: { ground: { level: 0 }, first: { level: 1 } },
      user: { is_admin: !location.search.includes("user") },
      connection: {
        async subscribeMessage(cb, msg) {
          if (msg.type !== "hue_lite/subscribe") throw new Error("unknown subscription");
          subscribers.add(cb);
          setTimeout(publish, 0);
          return () => subscribers.delete(cb);
        },
      },
      async callWS(msg) {
        window.calls.push({ ws: msg });
        if (msg.type === "hue_lite/config") {
          if (window.notSetUp) throw { code: "not_loaded" };
          return setup;
        }
        if (msg.type === "hue_lite/set_scenes") {
          if (msg.scenes) window.sharedData.layouts[msg.key] = msg.scenes;
          else delete window.sharedData.layouts[msg.key];
          setTimeout(publish, 0);
          return null;
        }
        if (msg.type === "hue_lite/set_dimmer") {
          if (!window.hass.user.is_admin) throw { code: "unauthorized" };
          const settings = { ...window.sharedData.dimmers[msg.device_id] };
          for (const key of ["lights", "scenes"]) if (key in msg) { if (msg[key]) settings[key] = msg[key]; else delete settings[key]; }
          if (Object.keys(settings).length) window.sharedData.dimmers[msg.device_id] = settings;
          else delete window.sharedData.dimmers[msg.device_id];
          setTimeout(publish, 0);
          return null;
        }
        if (msg.type === "hue_lite/claim_dashboard") {
          if (msg.release) { window.dashboardClaimed = false; setup.add_dashboard = true; return { claimed: false }; }
          const claimed = setup.add_dashboard && !window.dashboardClaimed;
          window.dashboardClaimed = true;
          setup.add_dashboard = false;
          return { claimed };
        }
        if (msg.type === "lovelace/dashboards/list") return window.dashboards.map(({ config, ...d }) => d);
        if (msg.type === "lovelace/config") {
          const d = window.dashboards.find((x) => x.url_path === msg.url_path);
          if (!d?.config) throw { code: "config_not_found" };
          return d.config;
        }
        if (msg.type === "lovelace/dashboards/create") { const { type, ...d } = msg; window.dashboards.push(d); return d; }
        if (msg.type === "lovelace/config/save") { window.dashboards.find((x) => x.url_path === msg.url_path).config = msg.config; return null; }
        if (msg.type === "frontend/get_user_data") return { value: window.userData[msg.key] ?? null };
        if (msg.type === "frontend/set_user_data") { window.userData[msg.key] = msg.value; return null; }
        return null;
      },
      callService(domain, service, data, target) {
        window.calls.push({ domain, service, data, target });
      },
    };

    // Home Assistant's card helpers: built-in cards show as their config.
    window.loadCardHelpers = async () => ({
      createCardElement(config) {
        const el = document.createElement("pre");
        el.className = "builtin";
        el.textContent = JSON.stringify(config, null, 1);
        return el;
      },
    });

    function card(config) {
      const el = document.createElement(config.type.replace(/^custom:/, ""));
      el.setConfig(config);
      el.hass = window.hass;
      return el;
    }

    window.ready = (async () => {
      window.dash = await customElements.get("ll-strategy-dashboard-hue-lite").generate({}, window.hass);
      document.getElementById("config").textContent = JSON.stringify(window.dash, null, 1);
      const [home, rooms, routines, dimmers] = window.dash.views[0].sections;
      for (const config of home.cards.filter((c) => c.type.startsWith("custom:"))) document.getElementById("home").appendChild(card(config));
      document.getElementById("rooms").appendChild(card(rooms.cards[0]));
      document.getElementById("routines").appendChild(card(routines.cards[0]));
      if (dimmers) document.getElementById("dimmers").appendChild(card(dimmers.cards[0]));
      // Home Assistant's page element, which the script finds hass on to add the dashboard.
      const page = document.createElement("home-assistant");
      page.hass = window.hass;
      document.body.appendChild(page);
    })();
  </script>
</body>
</html>
