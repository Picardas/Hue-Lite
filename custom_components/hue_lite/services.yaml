apply_preset:
  target:
    entity:
      domain: light
  fields:
    preset:
      required: true
      selector:
        select:
          translation_key: preset
          custom_value: true
          options:
            - energize
            - cool_bright
            - read
            - relax
            - rest
            - nightlight
            - golden_hour
            - nebula
            - aurora
            - ember
            - forest
            - moonlight

natural_light:
  target:
    entity:
      domain: light
  fields:
    follow:
      default: true
      selector:
        boolean:

next_scene:
  target:
    entity:
      domain: light

set_brightness:
  target:
    entity:
      domain: light
  fields:
    brightness_pct:
      required: true
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

set_auto:
  target:
    entity:
      domain: light
  fields:
    auto:
      required: true
      default: true
      selector:
        boolean:
